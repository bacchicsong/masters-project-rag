services:
  app:
    build:
      context: src
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8088:8088"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8088
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=definitions
      - API_ACESS_TOKEN=${GIGACHAT_AUTH_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ENABLE_TELEGRAM_BOT=${ENABLE_TELEGRAM_BOT:-true}
      - USE_CROSS_ENCODER=${USE_CROSS_ENCODER:-false}
      - PRELOAD_EMBEDDING_MODEL=${PRELOAD_EMBEDDING_MODEL:-true}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-local-dev-token}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_DATA_BUCKET=${MINIO_DATA_BUCKET:-rag-data}
      - MINIO_DATA_PREFIX=${MINIO_DATA_PREFIX:-parsed/}
      - USE_FINE_TUNED_MODEL=${USE_FINE_TUNED_MODEL:-false}
      - FINE_TUNED_MODEL_PATH=/app/models/fine_tuned_bi_encoder
      - FEEDBACK_DIR=/app/data/feedback
    volumes:
      - ./data:/app/data
      - models_data:/app/models
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    working_dir: /app
    depends_on:
      - qdrant
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    env_file:
      - .env
    networks:
      - app_network


  loader:
    build:
      context: src
      dockerfile: Dockerfile
    command: ["python", "/app/tools/fill_qdrant.py"]
    environment:
      - PYTHONPATH=/app
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=definitions
      - API_ACESS_TOKEN=${GIGACHAT_AUTH_KEY}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface
    volumes:
        - ./data:/app/data
        - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    env_file:
      - .env
    profiles:
      - manual
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI (консоль)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app_network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/mlflow-artifacts --ignore-existing;
      mc mb myminio/rag-data --ignore-existing;
      echo 'Bucket mlflow-artifacts created successfully';
      echo 'Bucket rag-data created successfully';
      "
    networks:
      - app_network

  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    profiles:
      - airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  airflow-init:
    build:
      context: airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    profiles:
      - airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local_airflow_secret}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      FASTAPI_INTERNAL_URL: http://app:8088/api/v1
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-token}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DATA_BUCKET: ${MINIO_DATA_BUCKET:-rag-data}
      MINIO_DATA_PREFIX: ${MINIO_DATA_PREFIX:-parsed/}
      PARSER_OUTPUT_DIR: /opt/airflow/tbank_knowledge
      NORMALIZED_OUTPUT_DIR: /opt/airflow/normalized
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/funcs:/opt/airflow/funcs
      - airflow_logs:/opt/airflow/logs
      - airflow_tbank_knowledge:/opt/airflow/tbank_knowledge
      - airflow_normalized:/opt/airflow/normalized
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true"
    networks:
      - app_network

  airflow-webserver:
    build:
      context: airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c "airflow webserver -w 1 -t 300"
    restart: on-failure
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  airflow-scheduler:
    build:
      context: airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: >
      bash -c "airflow scheduler"
    restart: on-failure
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - app
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    profiles:
      - observability
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - app_network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    profiles:
      - training
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      sh -c "mlflow server --host 0.0.0.0 --port 5000 --default-artifact-root s3://mlflow-artifacts/"
    depends_on:
      - minio
      - minio-init
    networks:
      - app_network

  fine-tune:
    build:
      context: src
      dockerfile: Dockerfile
    container_name: fine-tune
    command: ["python", "/app/tools/fine_tune_bi_encoder.py"]
    profiles:
      - training
    environment:
      - PYTHONPATH=/app
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - FINE_TUNED_MODEL_PATH=/app/models/fine_tuned_bi_encoder
      - FEEDBACK_DIR=/app/data/feedback
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface
    volumes:
      - ./data:/app/data
      - models_data:/app/models
      - hf_cache:/root/.cache/huggingface
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  qdrant_storage:
  minio_data:
  grafana_data:
  airflow_postgres_data:
  airflow_logs:
  airflow_tbank_knowledge:
  airflow_normalized:
  models_data:
  hf_cache:
